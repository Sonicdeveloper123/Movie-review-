<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Feature — Movie Reviews</title>
<meta name="description" content="Short, honest reviews of films worth your evening.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#160a0f;--panel:#22111a;--card:#2a1620;--ink:#f7efe2;--muted:#b9a99f;--line:#4a2a37;--red:#a3182a;--gold:#f4c95d;
--ease:cubic-bezier(.2,.8,.2,1);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 "Source Serif 4",Georgia,serif;overflow-x:hidden;
padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.ui{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 70px}

/* Curtain: the one big opening moment */
.curtain{position:fixed;inset:0;z-index:20;display:flex;pointer-events:none}
.curtain i{flex:1;background:repeating-linear-gradient(90deg,#7d1020 0 26px,#a3182a 26px 52px,#8c1223 52px 78px);
box-shadow:inset 0 0 90px rgba(0,0,0,.55);transition:transform 1.6s var(--ease) .35s}
.curtain.open i:first-child{transform:translateX(-101%)}
.curtain.open i:last-child{transform:translateX(101%)}
.curtain.gone{display:none}

.hero{position:relative;text-align:center;padding:calc(56px + env(safe-area-inset-top,0px)) 18px 30px}
.hero h1{margin:0;font-size:clamp(2.8rem,12vw,7rem);line-height:.95;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.hero h1 span{display:inline-block;transform:translateY(-120%);opacity:0}
.ready .hero h1 span{animation:drop .8s var(--ease) forwards;animation-delay:calc(1.1s + var(--i)*45ms)}
.hero h1 .sp{width:.3em}
@keyframes drop{0%{transform:translateY(-120%) rotate(-8deg);opacity:0}70%{transform:translateY(6%) rotate(1deg);opacity:1}100%{transform:none;opacity:1}}
.tag{margin:16px auto 0;max-width:40ch;color:var(--muted);opacity:0}
.ready .tag{animation:fade .8s ease forwards 2s}
@keyframes fade{to{opacity:1}}
.bulbs{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-around;padding:0 6px}
.bulbs b{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px 2px rgba(244,201,93,.7);animation:blink 1.6s infinite}
.bulbs b:nth-child(even){animation-delay:.8s}
@keyframes blink{50%{opacity:.25;box-shadow:none}}

/* Ticker */
.ticker{overflow:hidden;background:var(--red);border-block:2px solid var(--gold);padding:9px 0;transform:rotate(-1.2deg);margin:14px -10px 40px}
.track{display:flex;width:max-content;animation:scroll 32s linear infinite}
.track span{font:800 1.1rem "Bricolage Grotesque",sans-serif;white-space:nowrap;padding:0 22px;letter-spacing:.01em}
.track span::after{content:"★";color:var(--gold);margin-left:44px}
.ticker:hover .track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}

/* Spotlight */
.spot{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:30px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px;margin-bottom:34px;position:relative;overflow:hidden}
.spot::before{content:"";position:absolute;inset:-40% auto auto -10%;width:60%;aspect-ratio:1;background:radial-gradient(circle,var(--glow,#a3182a)55%,transparent 70%);opacity:.35;filter:blur(40px);transition:background .8s}
.spot>*{position:relative}
.spot .poster{width:100%;box-shadow:0 20px 50px rgba(0,0,0,.55);transform:rotate(-2deg)}
.spot .swap{animation:swap .7s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.spot h2{font-size:clamp(1.9rem,5vw,3rem);line-height:1;margin:0 0 6px;letter-spacing:-.02em}
.spot .sub{color:var(--muted);margin:0 0 12px}
.spot .verdict{max-width:52ch;margin:0 0 16px}
.ring{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:201;transition:stroke-dashoffset 1.3s var(--ease)}
.ring b{font:800 2rem "Bricolage Grotesque",sans-serif}
.dots{display:flex;gap:8px;margin-top:18px}
.dots button{width:26px;height:6px;border:0;border-radius:3px;background:var(--line);padding:0;cursor:pointer;overflow:hidden;position:relative}
.dots button.on::after{content:"";position:absolute;inset:0;background:var(--gold);transform-origin:left;animation:fill 5.5s linear forwards}
@keyframes fill{from{transform:scaleX(0)}}
.btn{font:700 1rem "Bricolage Grotesque",sans-serif;background:var(--gold);color:#24100a;border:0;border-radius:999px;padding:11px 22px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 22px rgba(244,201,93,.35)}

/* Filters */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.chip,select{font:600 .92rem "Bricolage Grotesque",sans-serif;border:1.5px solid var(--gold);background:transparent;color:var(--ink);border-radius:999px;padding:6px 15px;cursor:pointer;transition:background .25s,color .25s,transform .2s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--gold);color:#24100a}
select{margin-left:auto;background:var(--panel)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px;perspective:900px}
.card{all:unset;box-sizing:border-box;display:block;cursor:pointer;border-radius:8px;background:var(--card);border:1px solid var(--line);overflow:hidden;
opacity:0;animation:rise .7s var(--ease) forwards;animation-delay:calc(var(--i)*70ms);
transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .2s ease-out,box-shadow .3s}
.card.tilting{box-shadow:0 22px 40px rgba(0,0,0,.55),0 0 0 1px var(--gold)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.poster{aspect-ratio:2/3;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative;overflow:hidden}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.card:hover .poster::after{transform:translateX(120%)}
.poster b{font:800 1.7rem/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;text-wrap:balance}
.poster small{font:500 .85rem "Bricolage Grotesque",sans-serif;opacity:.85;margin-top:6px}
.score{position:absolute;top:12px;right:12px;background:var(--gold);color:#24100a;font:800 1rem "Bricolage Grotesque",sans-serif;border-radius:4px;padding:2px 8px;z-index:1}
.meta{padding:10px 14px 14px;font-size:.92rem;color:var(--muted)}
.meta p{margin:0}
.stars{color:var(--gold);letter-spacing:2px}

/* Modal */
.panel{position:fixed;inset:0;background:rgba(8,3,6,.72);display:flex;align-items:flex-end;justify-content:center;z-index:10;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.panel.open{opacity:1;visibility:visible}
.sheet{background:var(--panel);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:22px 20px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .55s var(--ease)}
.panel.open .sheet{transform:none}
.sheet h2{font-size:2.1rem;line-height:1.05;margin:0 0 4px;letter-spacing:-.02em}
.sheet .sub{color:var(--muted);margin:0 0 14px}
.close{float:right;font:700 .9rem "Bricolage Grotesque",sans-serif;background:none;border:1.5px solid var(--gold);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
.review{max-width:62ch}
h3{font-size:1.15rem;margin:26px 0 8px;border-top:1px solid var(--line);padding-top:16px}
.rr{padding:10px 0;border-bottom:1px solid var(--line);animation:swap .5s var(--ease)}
.rr p{margin:4px 0 0}
form{display:grid;gap:10px}
input,textarea{font:1rem "Source Serif 4",serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.pick{display:flex;gap:4px}
.pick button{font-size:2rem;background:none;border:0;color:var(--line);cursor:pointer;padding:0 2px;line-height:1;transition:transform .2s var(--ease),color .2s}
.pick button:hover{transform:scale(1.25)}
.pick button.on{color:var(--gold);animation:pop .35s var(--ease)}
@keyframes pop{50%{transform:scale(1.5) rotate(12deg)}}
.go{font:700 1rem "Bricolage Grotesque",sans-serif;background:var(--red);color:#fff;border:0;border-radius:6px;padding:12px;cursor:pointer;transition:filter .2s}
.go:hover{filter:brightness(1.2)}
.empty{color:var(--muted)}

@media (max-width:640px){.spot{grid-template-columns:1fr;padding:20px}.spot .poster{max-width:200px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important}
.curtain{display:none}.hero h1 span,.tag,.card{opacity:1;transform:none}
.track{animation:none}.ring .fg{transition:none}}
</style>
</head>
<body>

<div class="curtain" id="curtain" aria-hidden="true"><i></i><i></i></div>

<header class="hero">
  <div class="bulbs" aria-hidden="true"></div>
  <h1 id="title" aria-label="Second Feature">Second Feature</h1>
  <p class="tag">Short, honest reviews of films worth your evening.</p>
</header>

<div class="ticker" aria-hidden="true"><div class="track" id="track"></div></div>

<main class="wrap">
  <section class="spot" id="spot" aria-label="Featured review" aria-live="off"></section>
  <div class="bar" id="bar" role="group" aria-label="Filter and sort"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pt">
  <div class="sheet" id="sheet"></div>
</div>

<script>
var films=[
{id:1,t:"Parasite",y:2019,d:"Bong Joon-ho",g:["Thriller","Drama"],r:9.5,c:"#2f5d50",v:"A class satire that turns into a thriller without dropping a stitch. The house itself is the best character: every staircase and window says who belongs where. Funny for an hour, then devastating."},
{id:2,t:"Spirited Away",y:2001,d:"Hayao Miyazaki",g:["Animation","Fantasy"],r:9.4,c:"#7a3b69",v:"A ten-year-old survives a bathhouse for spirits by working hard and staying kind. Its strangeness is never explained, which is why it keeps feeling new. Watch it on the biggest screen you can."},
{id:3,t:"Mad Max: Fury Road",y:2015,d:"George Miller",g:["Action"],r:9.1,c:"#b5541c",v:"Two hours of chase, told almost without dialogue. Every stunt is clear, and the world is built through props and faces rather than exposition. The gold standard for action editing."},
{id:4,t:"Everything Everywhere All at Once",y:2022,d:"The Daniels",g:["Comedy","Sci-Fi","Drama"],r:8.8,c:"#c2185b",v:"Absurd, maximalist, and secretly about a mother and daughter who cannot talk to each other. It's a bit overstuffed, but the emotional payoff earns the mess."},
{id:5,t:"The Godfather",y:1972,d:"Francis Ford Coppola",g:["Crime","Drama"],r:9.8,c:"#3b2a1e",v:"A family story dressed as a crime epic. The slow, dark rooms and quiet threats still work, and Michael's shift from outsider to boss is one of cinema's great tragedies."},
{id:6,t:"Arrival",y:2016,d:"Denis Villeneuve",g:["Sci-Fi","Drama"],r:8.9,c:"#3a4a63",v:"First contact as a problem of language, grief, and choice. Patient and quiet, with an ending that recasts everything before it. Rewards a second viewing."},
{id:7,t:"Whiplash",y:2014,d:"Damien Chazelle",g:["Drama"],r:8.7,c:"#8a1c1c",v:"A drummer and his abusive teacher, cut like a sports film and played like a horror movie. It asks what greatness costs and refuses to answer comfortably."},
{id:8,t:"Moonlight",y:2016,d:"Barry Jenkins",g:["Drama"],r:9.0,c:"#1f6f8b",v:"Three chapters of one life, shot with warmth and tenderness. Much of it is said in silences and glances. Small in scale, enormous in feeling."}
];

var still=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var genre="All",sort="top",sel=null,stars=0,store={},feat=0,timer=null,lastFocus=null;
var $=function(id){return document.getElementById(id)};
try{store=JSON.parse(localStorage.getItem("sf-reviews")||"{}")}catch(e){}
function save(){try{localStorage.setItem("sf-reviews",JSON.stringify(store))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function starStr(n){var f=Math.round(n/2);return "★".repeat(f)+"☆".repeat(5-f)}
function byId(id){return films.filter(function(f){return f.id===id})[0]}
function poster(f){return '<div class="poster" style="background:linear-gradient(160deg,'+f.c+',#0d0508)"><span class="score">'+f.r+'</span><b>'+esc(f.t)+'</b><small>'+f.y+' · '+esc(f.d)+'</small></div>'}

/* Opening: curtain, bulbs, dropping letters, ticker */
(function intro(){
  var h=$("title"),txt="Second Feature";
  h.innerHTML=txt.split("").map(function(ch,i){return ch===" "?'<span class="sp" style="--i:'+i+'">&nbsp;</span>':'<span style="--i:'+i+'" aria-hidden="true">'+ch+'</span>'}).join("");
  var b="";for(var i=0;i<24;i++)b+="<b></b>";document.querySelector(".bulbs").innerHTML=b;
  var names=films.map(function(f){return "<span>"+esc(f.t)+"</span>"}).join("");
  $("track").innerHTML=names+names;
  if(still){$("curtain").className="curtain gone";document.body.className="ready";return}
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    $("curtain").classList.add("open");document.body.classList.add("ready");
    setTimeout(function(){$("curtain").classList.add("gone")},2300);
  })});
})();

/* Spotlight: auto-rotating featured review */
function drawSpot(){
  var f=films[feat];
  $("spot").style.setProperty("--glow",f.c);
  $("spot").innerHTML='<div class="swap">'+poster(f)+'</div><div class="swap"><h2>'+esc(f.t)+'</h2><p class="sub">'+f.y+' · Directed by '+esc(f.d)+'</p>'+
  '<div class="ring"><svg viewBox="0 0 76 76" aria-hidden="true"><circle class="bg" cx="38" cy="38" r="32"/><circle class="fg" id="fg" cx="38" cy="38" r="32"/></svg><b id="num">0.0</b></div>'+
  '<p class="verdict">'+esc(f.v)+'</p><button class="btn" id="spotBtn">Read full review</button>'+
  '<div class="dots" role="group" aria-label="Choose featured film">'+films.map(function(x,i){return '<button data-f="'+i+'" class="'+(i===feat?'on':'')+'" aria-label="Show '+esc(x.t)+'"></button>'}).join("")+'</div></div>';
  var fg=$("fg"),num=$("num"),target=f.r;
  requestAnimationFrame(function(){fg.style.strokeDashoffset=201-201*(target/10)});
  if(still){num.textContent=target.toFixed(1);return}
  var t0=null;(function step(t){if(!t0)t0=t;var p=Math.min((t-t0)/1300,1);num.textContent=(target*(1-Math.pow(1-p,3))).toFixed(1);if(p<1)requestAnimationFrame(step)})(performance.now());
}
function cycle(){clearInterval(timer);if(still)return;timer=setInterval(function(){feat=(feat+1)%films.length;drawSpot()},5500)}
$("spot").addEventListener("click",function(e){
  var d=e.target.getAttribute("data-f");
  if(d!==null){feat=+d;drawSpot();cycle();return}
  if(e.target.id==="spotBtn")openSheet(films[feat].id);
});
$("spot").addEventListener("pointerenter",function(){clearInterval(timer)});
$("spot").addEventListener("pointerleave",cycle);

/* Filters and grid */
var genres=["All"].concat(Array.from(new Set(films.reduce(function(a,f){return a.concat(f.g)},[]))).sort());
function drawBar(){
  $("bar").innerHTML=genres.map(function(g){return '<button class="chip" aria-pressed="'+(g===genre)+'" data-g="'+g+'">'+g+'</button>'}).join("")+
  '<select id="sort" aria-label="Sort films"><option value="top">Top rated</option><option value="new">Newest</option><option value="az">A to Z</option></select>';
  $("sort").value=sort;
}
$("bar").addEventListener("click",function(e){var g=e.target.getAttribute("data-g");if(g){genre=g;drawBar();drawGrid()}});
$("bar").addEventListener("change",function(e){if(e.target.id==="sort"){sort=e.target.value;drawGrid()}});
function drawGrid(){
  var list=films.filter(function(f){return genre==="All"||f.g.indexOf(genre)>-1});
  list.sort(function(a,b){return sort==="top"?b.r-a.r:sort==="new"?b.y-a.y:a.t.localeCompare(b.t)});
  $("grid").innerHTML=list.map(function(f,i){
    var n=(store[f.id]||[]).length;
    return '<button class="card" style="--i:'+i+'" data-id="'+f.id+'" aria-label="'+esc(f.t)+', rated '+f.r+' out of 10">'+poster(f)+'<div class="meta"><span class="stars">'+starStr(f.r)+'</span><p>'+f.g.join(", ")+(n?' · '+n+' reader review'+(n>1?'s':''):'')+'</p></div></button>'}).join("");
}
$("grid").addEventListener("click",function(e){var c=e.target.closest(".card");if(c)openSheet(+c.getAttribute("data-id"))});

/* 3D tilt that follows the pointer */
if(!still){
  $("grid").addEventListener("pointermove",function(e){
    if(e.pointerType==="touch")return;
    var c=e.target.closest(".card");if(!c)return;
    var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    c.style.setProperty("--ry",(x*14)+"deg");c.style.setProperty("--rx",(-y*14)+"deg");c.classList.add("tilting");
  });
  $("grid").addEventListener("pointerout",function(e){
    var c=e.target.closest(".card");if(!c)return;
    c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg");c.classList.remove("tilting");
  });
}

/* Review sheet */
var panel=$("panel"),sheet=$("sheet");
function openSheet(id){sel=byId(id);stars=0;lastFocus=document.activeElement;drawSheet();panel.classList.add("open");sheet.scrollTop=0;setTimeout(function(){sheet.querySelector(".close").focus()},50)}
function closeSheet(){panel.classList.remove("open");if(lastFocus)lastFocus.focus()}
panel.addEventListener("click",function(e){if(e.target===panel)closeSheet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
function drawSheet(){
  var f=sel,rs=store[f.id]||[];
  sheet.innerHTML='<button class="close" id="cl">Close</button><h2 id="pt">'+esc(f.t)+'</h2><p class="sub">'+f.y+' · Directed by '+esc(f.d)+' · '+f.g.join(", ")+'</p>'+
  '<p class="ui"><span class="stars">'+starStr(f.r)+'</span> <b>'+f.r+'</b> / 10</p><p class="review">'+esc(f.v)+'</p>'+
  '<h3>Reader reviews</h3>'+(rs.length?rs.map(function(r){return '<div class="rr"><span class="ui"><b>'+esc(r.n)+'</b></span> <span class="stars">'+"★".repeat(r.s)+"☆".repeat(5-r.s)+'</span><p>'+esc(r.x)+'</p></div>'}).join(""):'<p class="empty">No reader reviews yet. Be the first to write one.</p>')+
  '<h3>Write your review</h3><form id="fm"><input id="nm" placeholder="Your name" maxlength="40" required aria-label="Your name"><div class="pick" role="group" aria-label="Your rating">'+[1,2,3,4,5].map(function(i){return '<button type="button" data-s="'+i+'" class="'+(i<=stars?'on':'')+'" aria-label="'+i+' star'+(i>1?'s':'')+'">★</button>'}).join("")+'</div><textarea id="tx" rows="3" maxlength="500" placeholder="What did you think?" required aria-label="Your review"></textarea><button class="go" type="submit">Post review</button></form>';
  $("cl").onclick=closeSheet;
  sheet.querySelector(".pick").onclick=function(e){var s=e.target.getAttribute("data-s");if(!s)return;stars=+s;[].forEach.call(this.children,function(b){b.className=(+b.getAttribute("data-s")<=stars)?"on":""})};
  $("fm").onsubmit=function(e){e.preventDefault();
    if(!stars){alert("Choose a star rating first.");return}
    (store[f.id]=store[f.id]||[]).unshift({n:$("nm").value.trim(),s:stars,x:$("tx").value.trim()});
    save();stars=0;drawSheet();drawGrid();sheet.querySelector("h3").scrollIntoView();
  };
}

drawBar();drawGrid();drawSpot();cycle();
</script>
</body>
<
